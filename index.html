<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC Trio</title>
    <link rel="shortcut icon" href="favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero-cont">
        <img src="favicon.jpg" alt="pyramids" class="hero">
        <div class="title-cont">
            <h1>HC TRIO</h1>
            <h2>Stay Determined</h2>
        </div>
        <div class="hero-grad"></div>
    </div>
    <main>
        <div class="ppl">
            <img src="me.jpg" alt="Me">
            <p>ME (AboEl5yr), Jack of all trades, master of none, likes web, game, data science, machine learning, and cybersecurity</p>
            <p>Hazoro, The sensei, likes web, game, data science, cybersecurity</p>
            <img src="hazoro.jpg" alt="Hazoro">
            <img src="lotfy.jpg" alt="Lotfy">
            <p>Lotfy, That guy, likes game and cybersecurity</p>
        </div>
    </main>
    <script>
        const rev = document.querySelectorAll(".ppl img, .ppl p")

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting){
                    entry.target.classList.add("in-view")
                    observer.unobserve(entry.target)
                }
            })
        },{threshold: 0.2})

        rev.forEach(el => observer.observe(el))
    </script>
</body>
</html>
